<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แปลงความยาวของสตริง</title>
</head>
<body>
    <h2>หน้าจอแสดงการแปลงความยาวของสตริง</h2>
    <script>
        const byte_Size = str => new Blob([str]).size;
        console.log(byte_Size('Hello CS'));
        console.log(byte_Size('สวัสดี'));
    </script>
</body>
</html>
